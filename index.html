  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      /* GANTI background.jpg DENGAN GAMBAR KAMU SENDIRI */
      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.7)),
        url('https://i.postimg.cc/SRgRMRDc/8abe73c4-e510-400d-99c5-553498972443.png');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .container {
      text-align: center;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
     backdrop-filter: none;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 30px rgba(0,255,255,0.15);
      width: 90%;
      max-width: 420px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #fff2a6, #ffd700, #daa520, #ffec8b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0 0 5px rgba(255,215,0,0.9),
        0 0 10px rgba(255,215,0,0.8),
        0 0 20px rgba(218,165,32,0.7),
        0 0 35px rgba(255,215,0,0.6);
      animation: floating 2s ease-in-out infinite;
    }

    @keyframes floating {
      0% {
        transform: translateY(0px) scale(1);
      }

      50% {
        transform: translateY(-18px) scale(1.03);
      }

    }

    p {
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 14px;
    }

    
.btn-link {
  display: block;
  width: 100%;
  padding: 16px;
  margin: 14px 0;
  border-radius: 14px;
  border: 2px solid #FFD700;
  text-decoration: none;
  font-weight: 900;
  font-size: 16px;
  color: #FFFFFF;
  background: linear-gradient(135deg, #8B6508, #D4AF37, #FFD700);
  transition: 0.3s ease;
  box-shadow:
    0 0 15px rgba(255,215,0,0.6),
    0 0 30px rgba(255,215,0,0.4);
}

.btn-link:hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow:
    0 0 25px rgba(255,215,0,0.9),
    0 0 50px rgba(255,215,0,0.7);
}


    .footer {
      margin-top: 20px;
      color: #64748b;
      font-size: 12px;
    }
  
      .logo-wrapper {
      margin-bottom: 18px;
      animation: floatingLogo 2.8s ease-in-out infinite;
    }

    .logo {
      width: 110px;
      max-width: 100%;
      filter:
        drop-shadow(0 0 8px rgba(255,215,0,0.9))
        drop-shadow(0 0 18px rgba(255,215,0,0.7));
    }

    @keyframes floatingLogo {
      0% {
        transform: translateY(0px) scale(1);
      }

      25% {
        transform: translateY(-8px) scale(1.02);
      }

      50% {
        transform: translateY(-16px) scale(1.04);
      }

      75% {
        transform: translateY(-8px) scale(1.02);
      }

      100% {
        transform: translateY(0px) scale(1);
      }
    }
  </style>
</head>
